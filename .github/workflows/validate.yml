name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run validate

      # Real start, only for the apps this change touches. Heavy apps (GPU,
      # games, large images) carry a `.no-smoke` file and stay static-only.
      - name: Smoke-test changed apps
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          ids=$(git diff --name-only "$base" HEAD -- Apps | cut -d/ -f2 | sort -u \
            | while read -r id; do [ -d "Apps/$id" ] && [ ! -e "Apps/$id/.no-smoke" ] && echo "$id"; done)
          [ -z "$ids" ] || npm run smoke -- $ids
