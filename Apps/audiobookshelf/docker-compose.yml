name: audiobookshelf
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.1
    container_name: audiobookshelf
    restart: unless-stopped
    ports:
      - target: 80
        published: "13378"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/metadata
        target: /metadata
      - type: bind
        source: /DATA/AppData/$AppID/audiobooks
        target: /audiobooks
      - type: bind
        source: /DATA/AppData/$AppID/podcasts
        target: /podcasts
