name: flowise
services:
  flowise:
    image: flowiseai/flowise:3.1.3
    container_name: flowise
    restart: unless-stopped
    ports:
      - target: 3000
        published: "3002"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /root/.flowise
