name: freshrss
services:
  freshrss:
    image: freshrss/freshrss:1.30.1
    container_name: freshrss
    restart: unless-stopped
    ports:
      - target: 80
        published: "8091"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /var/www/FreshRSS/data
      - type: bind
        source: /DATA/AppData/$AppID/extensions
        target: /var/www/FreshRSS/extensions
