name: home-assistant
services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.0
    container_name: home-assistant
    restart: unless-stopped
    ports:
      - target: 8123
        published: "8123"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
