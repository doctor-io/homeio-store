name: immich
services:
  immich:
    image: ghcr.io/immich-app/immich-server:v3.3.0
    container_name: immich
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export DB_PASSWORD="$$(cat /secrets/db_pass)"
        exec tini -- /bin/bash -c start.sh
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    ports:
      - target: 2283
        published: "2283"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/upload
        target: /data
      - type: bind
        source: /DATA/AppData/$AppID/secrets
        target: /secrets
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_started

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.0
    container_name: immich-machine-learning
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/model-cache
        target: /cache

  immich-redis:
    image: docker.io/valkey/valkey:9
    container_name: immich-redis
    restart: unless-stopped

  # Only reachable from this stack, with a password of its own.
  immich-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-db
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        f=/secrets/db_pass
        if [ ! -s "$$f" ]; then
          read -r a < /proc/sys/kernel/random/uuid
          printf '%s' "$${a//-/}" > "$$f"
        fi
        export POSTGRES_PASSWORD="$$(cat $$f)"
        exec /usr/local/bin/immich-docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    shm_size: 128mb
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/db
        target: /var/lib/postgresql/data
      - type: bind
        source: /DATA/AppData/$AppID/secrets
        target: /secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 5s
      timeout: 5s
      retries: 20
