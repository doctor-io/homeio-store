id: kavita
name: Kavita
tagline:
  en: Read your comics, manga and ebooks in the browser.
  fr: Lisez vos BD, mangas et ebooks dans le navigateur.
description:
  en: |
    Kavita is a fast reader for comics, manga and books. Point it at a folder and it
    builds a tidy library with covers, reading progress and one account per reader.
    The first person to open it creates the admin account.
  fr: |
    Kavita est un lecteur rapide pour BD, mangas et livres. Indiquez un dossier et il
    construit une bibliothèque soignée avec couvertures, progression de lecture et un
    compte par lecteur. La première personne qui l'ouvre crée le compte administrateur.
category: productivity
developer: Kavita
website: https://www.kavitareader.com
main: kavita
port: 5000
