name: qbittorrent
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4
    container_name: qbittorrent
    restart: unless-stopped
    # Out of the box qBittorrent answers 401 to any address but localhost:8080,
    # so the page would never open from another device. Write its settings file
    # once, without that check, and hand over to the normal start-up.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        c=/config/qBittorrent/qBittorrent.conf
        if [ ! -f "$$c" ]; then
          mkdir -p /config/qBittorrent
          printf '[Preferences]\nWebUI\\HostHeaderValidation=false\n' > "$$c"
          chown -R 1000:1000 /config/qBittorrent
        fi
        exec /init
    environment:
      PUID: "1000"
      PGID: "1000"
      WEBUI_PORT: "8080"
    ports:
      - target: 8080
        published: "8100"
        protocol: tcp
      - target: 6881
        published: "6881"
        protocol: tcp
      - target: 6881
        published: "6881"
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Download
        target: /downloads
